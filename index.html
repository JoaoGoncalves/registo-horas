<style>
  /* =========================================================
     IDENTIDADE VISUAL — joaogoncalves.net
     Troca aqui as cores e fontes pelos valores exatos da marca.
     ========================================================= */
  @font-face{
    font-family:"FFF Corporate";
    src: local("FFF Corporate"), url("fonts/fff-corporate.woff2") format("woff2");
    font-display: swap;
  }
  :root{
    --charcoal:     #231f20;   /* fundo do cartão */
    --lime:         #87cf32;   /* verde .net */
    --brand:        #87cf32;   /* botões / destaques (texto escuro por cima) */
    --brand-dark:   #3f7310;   /* verde para texto sobre branco */
    --brand-soft:   #eef7e2;
    --ink:          #231f20;   /* texto principal */
    --muted:        #6e6a6b;
    --bg:           #f4f4f2;
    --surface:      #ffffff;
    --line:         #e3e2df;
    --warn:         #b5552f;
    --warn-soft:    #f8e8e0;
    --ok:           #3f7a3a;
    --ok-soft:      #e3f0df;
    --font-display: 'Chakra Petch', system-ui, sans-serif;
    --font-pixel:   'FFF Corporate', 'Chakra Petch', system-ui, sans-serif;
    --font-body:    'Inter', system-ui, sans-serif;
    --font-mono:    'JetBrains Mono', ui-monospace, monospace;
    --radius: 14px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-body);
    min-height:100vh; -webkit-font-smoothing:antialiased; line-height:1.45;
  }
  h1,h2,h3{ font-family:var(--font-display); margin:0; letter-spacing:-.01em; }
  .mono{ font-family:var(--font-mono); }
  button{ font-family:inherit; }
  ::selection{ background:var(--lime); color:var(--charcoal); }
  :focus-visible{ outline:3px solid var(--brand); outline-offset:2px; }

  /* ---------- MARCA ---------- */
  .brand{ display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:var(--ink); }
  .brand img{ height:40px; width:auto; display:block; }
  .login-wrap .brand img{ height:64px; }
  .wordmark{ font-family:var(--font-display); font-weight:700; font-size:1.02rem; }
  .wordmark b{ color:var(--lime); }
  .tagline{ font-family:var(--font-pixel); font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--lime); }

  /* ---------- LOGIN ---------- */
  #app{ max-width:960px; margin:0 auto; padding:16px 16px 60px; }
  body.dark{ background:var(--charcoal); }
  .login-wrap{ min-height:calc(100vh - 40px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; }
  .login-card{
    width:100%; max-width:360px; background:var(--surface); border:1px solid var(--line);
    border-radius:20px; padding:28px 24px; text-align:center; box-shadow:0 10px 30px -18px rgba(40,50,10,.35);
  }
  .login-card h1{ font-size:1.35rem; margin-bottom:4px; }
  .login-card p{ color:var(--muted); font-size:.9rem; margin:0 0 18px; }
  .pin-dots{ display:flex; justify-content:center; gap:14px; margin:6px 0 20px; }
  .pin-dots span{ width:16px; height:16px; border-radius:3px; border:2px solid var(--charcoal); }
  .pin-dots span.on{ background:var(--lime); border-color:var(--lime); }
  .keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .keypad button{
    height:62px; border-radius:14px; border:1px solid var(--line); background:var(--bg);
    font-size:1.5rem; font-family:var(--font-display); font-weight:500; color:var(--ink); cursor:pointer;
  }
  .keypad button:active{ background:var(--lime); }
  .keypad .ghost{ background:transparent; border-color:transparent; font-size:1rem; color:var(--muted); }
  .login-error{ color:var(--warn); font-size:.88rem; min-height:1.3em; margin-top:12px; }
  .link-btn{ background:none; border:none; color:var(--muted); font-size:.82rem; text-decoration:underline; cursor:pointer; margin-top:14px; }
  .shake{ animation:shake .35s; }
  @keyframes shake{ 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }

  /* ---------- LAYOUT ---------- */
  .topbar{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:18px;
    background:var(--charcoal); border-radius:var(--radius); padding:12px 14px; }
  .topbar .btn-outline{ background:transparent; color:#fff; border-color:#4a4546; }
  .topbar .btn-outline:hover{ color:var(--lime); border-color:var(--lime); }

  .topbar-right{ display:flex; align-items:center; gap:8px; }
  .badge{ font-size:.72rem; padding:5px 10px; border-radius:20px; background:var(--brand-soft); color:var(--brand-dark); font-weight:600; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:11px 16px; border-radius:10px;

  }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-primary{ background:var(--lime); color:var(--charcoal); }
  .btn-primary:hover:not(:disabled){ background:#76bb26; }
  .btn-outline{ background:var(--surface); border-color:var(--line); color:var(--ink); }
  .btn-outline:hover:not(:disabled){ border-color:var(--brand); color:var(--brand-dark); }
  .btn-danger{ background:transparent; border-color:var(--warn); color:var(--warn); }
  .btn-sm{ padding:6px 10px; font-size:.78rem; border-radius:8px; }
  .btn-block{ width:100%; }
  .btn-big{ padding:16px; font-size:1.05rem; border-radius:14px; }
  .icon-btn{ background:none; border:none; cursor:pointer; padding:6px; border-radius:8px; color:var(--muted); font-size:.95rem; }
  .icon-btn:hover{ background:var(--brand-soft); color:var(--ink); }

  .hello{ margin:4px 0 18px; }
  .hello h1{ font-size:1.6rem; }
  .hello p{ margin:4px 0 0; color:var(--muted); }

  section{ margin-bottom:18px; }
  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; }
  .panel > h2, section > h2{ font-size:1.05rem; margin-bottom:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .hint{ font-family:var(--font-body); font-weight:400; font-size:.78rem; color:var(--muted); }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }

  .row{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  .row > .field{ flex:1; min-width:130px; }
  .dow{ font-size:.82rem; color:var(--brand-dark); margin-top:5px; font-weight:500; }

  .stepper{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:8px; }
  .stepper button{
    width:58px; font-weight:700; height:58px; border-radius:12px; border:none; background:var(--surface); font-size:1.7rem;
    color:var(--brand-dark); cursor:pointer; box-shadow:0 1px 0 var(--line); font-family:var(--font-display);
  }
  .stepper button:active{ background:var(--brand-soft); }
  .stepper .val{ font-family:var(--font-display); font-size:2.1rem; font-weight:700; }
  .stepper .val small{ font-size:1rem; color:var(--muted); font-weight:500; }

  /* ---------- LISTAS / TABELAS ---------- */
  .list{ list-style:none; margin:0; padding:0; }
  .list li{ display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px dashed var(--line); }
  .list li:last-child{ border-bottom:none; }
  .list .grow{ flex:1; min-width:0; }
  .list .meta{ font-size:.74rem; color:var(--muted); margin-top:3px; }
  .note-text{ white-space:pre-wrap; word-wrap:break-word; }
  .note-new{ background:var(--warn-soft); border-radius:12px; padding:12px !important; border-bottom:none !important; margin-bottom:8px; }
  .empty{ color:var(--muted); font-size:.88rem; padding:6px 0; }

  .table-scroll{ overflow-x:auto; }
  table{ border-collapse:collapse; width:100%; font-size:.88rem; }
  th, td{ padding:9px 8px; text-align:left; white-space:nowrap; border-bottom:1px solid var(--line); }
  th{ font-size:.7rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:500; }
  td.num, th.num{ text-align:right; font-family:var(--font-mono); }
  td.wrap{ white-space:normal; min-width:140px; color:var(--muted); font-size:.82rem; }
  tfoot td{ font-weight:700; border-bottom:none; }

  .pill{ display:inline-block; font-size:.72rem; font-weight:700; padding:4px 10px; border-radius:20px; }
  .pill.ok{ background:var(--ok-soft); color:var(--ok); }
  .pill.warn{ background:var(--warn-soft); color:var(--warn); }
  .pill.neutral{ background:var(--bg); color:var(--muted); border:1px solid var(--line); }

  .month-nav{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .month-nav h2{ font-size:1.25rem; min-width:170px; text-align:center; }

  .callout{ background:var(--brand-soft); border-radius:12px; padding:12px 14px; font-size:.88rem; margin-bottom:14px; }
  .callout.warn{ background:var(--warn-soft); }

  footer{ text-align:center; color:var(--muted); font-size:.74rem; margin-top:28px; line-height:1.6; }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:12px 18px; border-radius:12px; font-size:.9rem; z-index:20; box-shadow:0 8px 24px rgba(0,0,0,.25);
    max-width:calc(100% - 32px);
  }
  .toast.err{ background:var(--warn); }
  .busy{ position:fixed; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,transparent,var(--lime),transparent); background-size:200% 100%; animation:busy 1s linear infinite; z-index:30; }
  @keyframes busy{ from{background-position:200% 0} to{background-position:-200% 0} }
  .loading{ text-align:center; padding:80px 20px; color:var(--muted); }

  @media (max-width:760px){
    .cards{ grid-template-columns:repeat(2,1fr); }
    .grid-2{ grid-template-columns:1fr; }
    .month-nav h2{ min-width:0; flex:1; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
  @media print{
    .no-print, .topbar-right, footer{ display:none !important; }
    body{ background:#fff; }
  }
</style>

<script>
/* =========================================================

      },
      {
          "role": "admin",
          "nome": "Elsa",
          "salt": "DrY/5oCW0H2E4rQGUnab7w==",
          "iv": "09EaI2tJR5488hCJ",
          "ct": "Hatu4KWe0YlHfJM7K8b/bluRQcdjKVceFwJXQrS8itAyhKFdiAL0wjz5xrHIQ7kHiEa6jeq7E/XjdqtrqmTB7s5MMvkXHxJBPQ1/JSZ4l4Z4lWqH75P3H50W2brvPt18eUd5wIx76AL88fS7XFEuOZLS0J3uqxXNUYcqKQ=="
      }
  ]
};

/* =========================================================
   UTILITÁRIOS
   ========================================================= */
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DIAS  = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];

const pad = n => String(n).padStart(2,"0");
const isoDate = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => isoDate(new Date());
const monthOf = iso => iso.slice(0,7);
const parseIso = iso => { const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d); };
const dowOf = iso => DIAS[parseIso(iso).getDay()];
const fmtDate = iso => iso === "2000-01-01" ? "o início" : iso ? iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4) : "—";
const fmtDateShort = iso => iso ? iso.slice(8,10)+"/"+iso.slice(5,7) : "—";
const monthLabel = key => { const [y,m] = key.split("-").map(Number); return MESES[m-1]+" "+y; };
const shiftMonth = (key, delta) => { const [y,m] = key.split("-").map(Number); const d = new Date(y, m-1+delta, 1); return d.getFullYear()+"-"+pad(d.getMonth()+1); };
const fmtEur = v => (Number(v)||0).toLocaleString("pt-PT",{style:"currency",currency:"EUR"});
const fmtH = h => (Number(h)||0).toLocaleString("pt-PT",{maximumFractionDigits:2})+" h";
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const round2 = n => Math.round(n*100)/100;

function nextWeekday(dow){
  const d = new Date(); const diff = (dow - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + diff); return isoDate(d);
}

/* =========================================================
   DADOS
   ========================================================= */
function emptyState(){
  return { version:1, rates:[], registos:[], despesas:[], mensagens:[], pagamentos:{}, notas:[], updatedAt:null };
}
function normalize(s){
  const e = emptyState();
  if(!s || typeof s !== "object") return e;
  return {
    version: 1,
    rates:      Array.isArray(s.rates) ? s.rates : [],
    registos:   Array.isArray(s.registos) ? s.registos : [],
    despesas:   Array.isArray(s.despesas) ? s.despesas : [],
    mensagens:  Array.isArray(s.mensagens) ? s.mensagens : [],
    pagamentos: (s.pagamentos && typeof s.pagamentos === "object") ? s.pagamentos : {},
    notas:      Array.isArray(s.notas) ? s.notas : [],
    updatedAt:  s.updatedAt || null
  };
}

const LOCAL_KEY = "registo-horas-state-v1";
const Store = {
  mode(){ return SECRET ? "cloud" : "local"; },
  async load(){
    if(this.mode() === "cloud"){
      const res = await fetch("https://api.jsonbin.io/v3/b/"+SECRET.binId+"/latest", {
        headers: { [CONFIG.keyHeader]: SECRET.key, "X-Bin-Meta": "false" },
        cache: "no-store"
      });
      if(!res.ok) throw new Error("Leitura falhou ("+res.status+")");
      return normalize(await res.json());
    }
    try{ return normalize(JSON.parse(localStorage.getItem(LOCAL_KEY))); }
    catch(e){ return emptyState(); }
  },
  async save(state){
    if(this.mode() === "cloud"){
      const res = await fetch("https://api.jsonbin.io/v3/b/"+SECRET.binId, {
        method: "PUT",
        headers: { "Content-Type":"application/json", [CONFIG.keyHeader]: SECRET.key },
        body: JSON.stringify(state)
      });
      if(!res.ok) throw new Error("Gravação falhou ("+res.status+")");
      return;
    }
    localStorage.setItem(LOCAL_KEY, JSON.stringify(state));
  }
};

let STATE = emptyState();

/* Lê sempre a versão mais recente antes de gravar, para não apagar
   alterações feitas entretanto no outro telemóvel. */
async function mutate(fn, okMsg){
  setBusy(true);
  try{
    const fresh = await Store.load();
    const result = fn(fresh);
    if(result === false){ return false; }
    fresh.updatedAt = new Date().toISOString();
    await Store.save(fresh);
    STATE = fresh;
    if(okMsg) toast(okMsg);
    return true;
  }catch(e){
    console.error(e);
    toast("Não foi possível guardar. Verifica a ligação à internet e tenta outra vez.", true);
    return false;
  }finally{
    setBusy(false);
    render();
  }
}

/* ---------- regras de negócio ---------- */
function sortedRates(s){ return [...s.rates].sort((a,b)=> a.desde.localeCompare(b.desde)); }
function rateFor(s, iso){
  const r = sortedRates(s); if(!r.length) return null;
  let cur = r[0].valor;
  for(const x of r){ if(x.desde <= iso) cur = x.valor; else break; }
  return Number(cur);
}
function currentRate(s){ return rateFor(s, today()); }
function registosDoMes(s, key){
  return s.registos.filter(r => monthOf(r.data) === key).sort((a,b)=> a.data.localeCompare(b.data));
}
function resumoMes(s, key){
  const regs = registosDoMes(s, key);
  let horas = 0, valor = 0, semValor = false;
  regs.forEach(r => {
    const rate = rateFor(s, r.data);
    horas += Number(r.horas)||0;
    if(rate == null) semValor = true; else valor += (Number(r.horas)||0) * rate;
  });
  const despesas = s.despesas.filter(d => monthOf(d.data) === key).sort((a,b)=> a.data.localeCompare(b.data));
  const totalDespesas = round2(despesas.reduce((a,d)=> a + (Number(d.valor)||0), 0));
  const pag = s.pagamentos[key] || null;
  return { regs, horas: round2(horas), valorHoras: round2(valor), despesas, totalDespesas,
           valor: round2(valor + totalDespesas), semValor, pago: !!(pag && pag.pago), pagamento: pag };
}
function mesesComDados(s){
  const set = new Set(s.registos.map(r => monthOf(r.data)));
  s.despesas.forEach(d => set.add(monthOf(d.data)));
  Object.keys(s.pagamentos).forEach(k => set.add(k));
  set.add(monthOf(today()));
  return [...set].sort().reverse();
}
function notasPorTipo(s, tipo){
  return s.notas.filter(n => n.tipo === tipo).sort((a,b)=> b.criadaEm.localeCompare(a.criadaEm));
}

/* =========================================================

   ========================================================= */
const SESSION_KEY = "registo-horas-sessao";
let ROLE = null;  // "admin" | "laura"
let ADMIN_NOME = null;  // "João" | "Elsa"
const nomesAdmins = () => CONFIG.admins.join(" e ");
let SECRET = null;   // { binId, key } — só existe depois de entrar
const MODO_DEMO = !CONFIG.acessos.length;

/* ---------- desencriptação (Web Crypto) ---------- */
const b64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
async function tryDecrypt(secret, entry){
  try{
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey("raw", enc.encode(secret), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name:"PBKDF2", salt: b64(entry.salt), iterations: CONFIG.iteracoes, hash:"SHA-256" },
      base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv: b64(entry.iv) }, key, b64(entry.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }catch(e){ return null; }
}
/* devolve as entradas que este segredo abre */
async function unlock(secret, roles){
  const found = [];
  for(const e of CONFIG.acessos.filter(a => roles.includes(a.role))){
    const data = await tryDecrypt(secret, e);
    if(data) found.push({ entry: e, data });
  }
  return found;
}
const ui = {
  loginMode: "pin", pin: "", loginError: "",
  mes: monthOf(today()),
  form: null,          // formulário de registo da Laura
  adminForm: null,     // formulário de registo do admin
  editNotaId: null,
  rateForm: null,
  showDespesa: false,
  despesa: { descricao: "", valor: "", data: today() },
  msg: ""
};

function loadSession(){
  try{
    const s = JSON.parse(localStorage.getItem(SESSION_KEY));
    if(!s || !(s.exp > Date.now())) return null;
    if(!MODO_DEMO && !(s.secret && s.secret.binId && s.secret.key)) return null;
    SECRET = MODO_DEMO ? null : s.secret;
    if(s.role === "laura") return s.role;
    if(s.role === "admin" && CONFIG.admins.includes(s.nome)){ ADMIN_NOME = s.nome; return s.role; }
  }catch(e){}
  return null;
}
function saveSession(role){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify({ role, nome: ADMIN_NOME, secret: SECRET, exp: Date.now() + CONFIG.sessaoDias*864e5 })); }catch(e){}
}
function logout(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
  ROLE = null; ADMIN_NOME = null; SECRET = null; STATE = emptyState(); ui.pin = ""; ui.loginError = ""; ui.loginMode = "pin";
  render();
}
async function enter(role){
  ROLE = role; saveSession(role);
  await refresh();
}
let checking = false;
function loginFail(msg){
  ui.loginError = msg; ui.pin = ""; checking = false;
  render(); const c = document.querySelector(".login-card"); if(c) c.classList.add("shake");
}
async function tryPin(){
  if(checking) return;
  if(MODO_DEMO){ if(ui.pin === "1234"){ enter("laura"); } else loginFail("PIN errado. Tenta outra vez."); return; }
  checking = true; ui.loginError = "A verificar…"; render();
  const r = await unlock(ui.pin, ["laura"]);
  checking = false;
  if(r.length){ SECRET = r[0].data; ui.loginError = ""; enter("laura"); return; }
  loginFail("PIN errado. Tenta outra vez.");
}
async function tryPassword(){
  if(checking) return;
  const v = (document.getElementById("pw")||{}).value || "";
  if(!v) return;
  if(MODO_DEMO){
    if(v === "demo"){ ui.who = CONFIG.admins; ui.loginMode = "who"; ui.loginError = ""; render(); }
    else loginFail("Password incorreta.");
    return;
  }
  checking = true; ui.loginError = "A verificar…"; render();
  const r = await unlock(v, ["admin","laura"]);
  checking = false;
  const admins = r.filter(x => x.entry.role === "admin");
  if(admins.length === 1){ SECRET = admins[0].data; ADMIN_NOME = admins[0].entry.nome; ui.loginError = ""; enter("admin"); return; }
  if(admins.length > 1){ SECRET = admins[0].data; ui.who = admins.map(x => x.entry.nome); ui.loginMode = "who"; ui.loginError = ""; render(); return; }
  if(r.length){ SECRET = r[0].data; ui.loginError = ""; enter("laura"); return; }
  loginFail("Password incorreta.");
}

      </div>
      <div class="login-error">${esc(ui.loginError)}</div>
      <button class="link-btn" data-mode="pw">Entrar como administrador</button>
    ` : `
      <h1>Administração</h1>
      <p>Acesso reservado.</p>
      <div class="field"><input type="password" id="pw" placeholder="Password" autocomplete="current-password"></div>
      <button class="btn btn-primary btn-block" id="pw-btn">Entrar</button>
      <div class="login-error">${esc(ui.loginError)}</div>
      <button class="link-btn" data-mode="pin">Voltar ao PIN</button>
    `;
  return `
    <div class="login-wrap">
      ${BRAND_HTML}
      <div class="login-card">${inner}</div>
      <div class="tagline">Making the complicated simple</div>
    </div>`;
}
function bindLogin(){
  document.querySelectorAll(".keypad button").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.k; ui.loginError = "";
    if(k === "clear") ui.pin = "";
    else if(k === "back") ui.pin = ui.pin.slice(0,-1);
    else if(ui.pin.length < CONFIG.pinDigitos) ui.pin += k;
    if(ui.pin.length === CONFIG.pinDigitos){ tryPin(); return; }
    render();
  }));
  document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => {
    ui.loginMode = b.dataset.mode; ui.loginError = ""; ui.pin = ""; render();
    const pw = document.getElementById("pw"); if(pw) pw.focus();
  }));
  document.querySelectorAll("[data-who]").forEach(b => b.addEventListener("click", () => {
    ADMIN_NOME = b.dataset.who; enter("admin");
  }));
  const pw = document.getElementById("pw");
  if(pw){
    pw.addEventListener("keydown", e => { if(e.key === "Enter") tryPassword(); });
    document.getElementById("pw-btn").addEventListener("click", tryPassword);
  }
}
document.addEventListener("keydown", e => {
  if(ROLE || ui.loginMode !== "pin") return;
  if(/^[0-9]$/.test(e.key) && ui.pin.length < CONFIG.pinDigitos){
    ui.pin += e.key; ui.loginError = "";
    if(ui.pin.length === CONFIG.pinDigitos) tryPin(); else render();
  } else if(e.key === "Backspace"){ ui.pin = ui.pin.slice(0,-1); render(); }
});

function topbar(label){

        <button class="btn btn-outline btn-sm" data-act="logout">Sair</button>

}

              <tr>

                <td class="num">${fmtH(x.horas)}</td>
                <td class="num">${rt != null ? fmtEur(rt) : "—"}</td>
                <td class="num">${rt != null ? fmtEur(rt * x.horas) : "—"}</td>

                <td style="text-align:right">

                  <button class="icon-btn" data-act="reg-apagar" data-id="${x.id}" title="Apagar">🗑</button>

          <tfoot><tr><td colspan="2">Total horas</td><td class="num">${fmtH(r.horas)}</td><td></td><td class="num">${fmtEur(r.valorHoras)}</td><td colspan="2"></td></tr></tfoot>

      </div>` : `<div class="empty">Sem registos neste mês.</div>`}

      ${r.despesas.length ? `
      <h3 style="font-size:.9rem;margin:18px 0 4px;">Despesas extra</h3>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Data</th><th>Descrição</th><th class="num">Valor</th><th></th></tr></thead>
          <tbody>
            ${r.despesas.map(d => `
              <tr>
                <td class="mono">${fmtDate(d.data)}</td>
                <td class="wrap" style="color:var(--ink)">${esc(d.descricao)}</td>
                <td class="num">${fmtEur(d.valor)}</td>
                <td style="text-align:right"><button class="icon-btn" data-act="despesa-del" data-id="${d.id}" title="Apagar">🗑</button></td>
              </tr>`).join("")}
          </tbody>
          <tfoot><tr><td colspan="2">Total despesas</td><td class="num">${fmtEur(r.totalDespesas)}</td><td></td></tr></tfoot>
        </table>
      </div>` : ""}
      ${r.despesas.length || r.regs.length ? `<div class="callout" style="margin:14px 0 0;"><strong>Total do mês: ${fmtEur(r.pago ? r.pagamento.valor : r.valor)}</strong>${r.totalDespesas ? ` <span class="hint">(${fmtEur(r.valorHoras)} horas + ${fmtEur(r.totalDespesas)} despesas)</span>` : ""}</div>` : ""}

      <div class="row" style="margin-top:14px;">
        ${r.pago
          ? `<button class="btn btn-outline" data-act="desmarcar-pago">Anular pagamento</button>`

        <button class="btn btn-outline" data-act="copiar-resumo">Copiar resumo</button>
        ${r.pago ? "" : `<a class="btn btn-outline" href="${waLink(textoResumo(key))}" target="_blank" rel="noopener">WhatsApp</a>`}
        <button class="btn btn-outline" data-act="imprimir">PDF / Imprimir</button>
      </div>
    </section>

    <section class="panel no-print">
      <h2>${af.id ? "Editar registo" : "Adicionar registo"} <span class="hint">por ti, se a ${esc(CONFIG.nomeColaboradora)} se esquecer</span></h2>
      <div class="row">
        <div class="field"><label class="f" for="a-data">Dia</label><input type="date" id="a-data" value="${af.data}" max="${today()}"></div>
        <div class="field" style="max-width:140px"><label class="f" for="a-horas">Horas</label><input type="number" id="a-horas" min="0.5" step="0.5" value="${af.horas}"></div>
        <div class="field" style="flex:2"><label class="f" for="a-obs">Observações</label><input type="text" id="a-obs" value="${esc(af.obs)}"></div>
      </div>
      <div class="row">
        <button class="btn btn-primary" data-act="reg-guardar">${af.id ? "Guardar alterações" : "Adicionar"}</button>
        ${af.id ? `<button class="btn btn-outline" data-act="reg-cancelar">Cancelar</button>` : ""}
      </div>
    </section>

    <div class="grid-2">
      <section class="panel no-print">
        <h2>Notas para a ${esc(CONFIG.nomeColaboradora)} ${porLer ? `<span class="pill warn">${porLer} por ler</span>`:""}</h2>
        <div class="field">
          <label class="f" for="n-tipo">Tipo</label>
          <select id="n-tipo">
            <option value="proxima">Para a próxima limpeza</option>
            <option value="geral">Indicação geral (fica fixa)</option>
          </select>
        </div>
        <div class="field"><label class="f" for="n-txt">Texto</label><textarea id="n-txt" rows="3" placeholder="Ex.: Esta semana, limpar os vidros da varanda."></textarea></div>
        <button class="btn btn-primary" data-act="nota-add">Adicionar nota</button>

        <h3 style="font-size:.9rem;margin:20px 0 4px;">Para a próxima limpeza</h3>
        ${prox.length ? `<ul class="list">${prox.map(notaItem).join("")}</ul>` : `<div class="empty">Sem notas.</div>`}
        <h3 style="font-size:.9rem;margin:20px 0 4px;">Indicações gerais</h3>
        ${gerais.length ? `<ul class="list">${gerais.map(notaItem).join("")}</ul>` : `<div class="empty">Sem indicações.</div>`}
        <h3 style="font-size:.9rem;margin:20px 0 4px;">Mensagens da ${esc(CONFIG.nomeColaboradora)}</h3>
        ${STATE.mensagens.length ? `<ul class="list">${[...STATE.mensagens].sort((a,b)=> b.criadaEm.localeCompare(a.criadaEm)).slice(0,15).map(m => `
          <li>
            <div class="grow"><div class="note-text">${esc(m.texto)}</div>
              <div class="meta">${fmtDate(m.criadaEm.slice(0,10))} · ${m.vista ? `<span class="pill ok">Vista${m.vistaPor ? " por "+esc(m.vistaPor) : ""}</span>` : `<span class="pill warn">Por ver</span>`}</div>
            </div>
            <button class="icon-btn" data-act="msg-apagar" data-id="${m.id}" title="Apagar">🗑</button>
          </li>`).join("")}</ul>` : `<div class="empty">Sem mensagens.</div>`}
      </section>

      <div>
        <section class="panel no-print">
          <h2>Valor-hora</h2>
          <p class="hint" style="margin:-6px 0 12px;">Aplica-se aos registos a partir da data indicada (por defeito hoje; podes escolher uma data anterior se te esqueceres de atualizar). Meses já pagos não mudam.</p>
          <div class="row">
            <div class="field" style="max-width:130px"><label class="f" for="r-valor">€ / hora</label><input type="number" id="r-valor" min="0" step="0.5" value="${rf.valor}"></div>
            <div class="field"><label class="f" for="r-desde">A partir de</label><input type="date" id="r-desde" value="${rf.desde}"></div>
          </div>
          <button class="btn btn-primary" data-act="rate-add">${rate == null ? "Definir valor" : "Atualizar valor"}</button>
          ${STATE.rates.length ? `
          <ul class="list" style="margin-top:12px;">
            ${sortedRates(STATE).reverse().map(x => `
              <li><div class="grow"><strong>${fmtEur(x.valor)}</strong> / hora<div class="meta">desde ${fmtDate(x.desde)}</div></div>
              ${STATE.rates.length > 1 ? `<button class="icon-btn" data-act="rate-del" data-desde="${x.desde}" title="Apagar">🗑</button>` : ""}</li>`).join("")}
          </ul>` : ""}
        </section>

        <section class="panel">
          <h2>Histórico</h2>
          <div class="table-scroll">
            <table>
              <thead><tr><th>Mês</th><th class="num">Horas</th><th class="num">Valor</th><th>Estado</th></tr></thead>
              <tbody>
                ${meses.map(k => { const x = resumoMes(STATE,k); return `
                  <tr style="cursor:pointer" data-act="ir-mes" data-mes="${k}">
                    <td>${monthLabel(k)}</td><td class="num">${fmtH(x.horas)}</td>
                    <td class="num">${fmtEur(x.pago ? x.pagamento.valor : x.valor)}</td>
                    <td>${x.pago ? `<span class="pill ok">Pago</span>` : (x.regs.length ? `<span class="pill warn">Por pagar</span>` : `<span class="pill neutral">—</span>`)}</td>
                  </tr>`; }).join("")}
              </tbody>
            </table>
          </div>
          <div class="row" style="margin-top:12px;">
            <button class="btn btn-outline" data-act="excel">Exportar Excel</button>
          </div>
        </section>
      </div>
    </div>

    ${footer()}`;
}

function waLink(txt){
  const tel = String(CONFIG.telefoneColaboradora||"").replace(/\D/g,"");
  return "https://wa.me/"+tel+"?text="+encodeURIComponent(txt);
}
function textoPagamento(key){
  const r = resumoMes(STATE, key);
  const p = r.pagamento || {};
  const dias = r.regs.map(x => `• ${fmtDateShort(x.data)}: ${fmtH(x.horas)}`).join("\n");
  const desp = r.despesas.map(d => `• ${esc0(d.descricao)}: ${fmtEur(d.valor)}`).join("\n");
  return `Olá ${CONFIG.nomeColaboradora} 😊

Já fiz a transferência referente a ${monthLabel(key)}.

${dias}
Total: ${fmtH(p.horas ?? r.horas)}${r.despesas.length ? `

Despesas extra:
${desp}` : ""}

💶 Valor transferido: ${fmtEur(p.valor ?? r.valor)}

Envio a seguir o comprovativo.
Obrigado!${ADMIN_NOME ? "\n"+ADMIN_NOME : ""}`;
}
const esc0 = t => String(t ?? "");
function textoResumo(key){
  const r = resumoMes(STATE, key);
  const linhas = r.regs.map(x => `• ${fmtDateShort(x.data)} (${dowOf(x.data).replace("-feira","")}): ${fmtH(x.horas)}`).join("\n");
  return `🧹 Horas de ${CONFIG.nomeColaboradora} — ${monthLabel(key)}

${linhas || "Sem registos."}
${r.despesas.length ? "\nDespesas extra:\n"+r.despesas.map(d => `• ${d.descricao}: ${fmtEur(d.valor)}`).join("\n")+"\n" : ""}
Total: ${fmtH(r.horas)}
Valor: ${fmtEur(r.pago ? r.pagamento.valor : r.valor)}
Estado: ${r.pago ? "Pago a "+fmtDate(r.pagamento.data) : "Por pagar"}`;
}

   AÇÕES
   ========================================================= */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if(!el || !ROLE) return;
  const act = el.dataset.act;
  switch(act){
    case "logout": logout(); break;
    case "refresh": await refresh(true); break;

    /* --- Laura --- */
    case "horas": {
      const v = Math.max(0, Math.min(12, ui.form.horas + Number(el.dataset.d)));
      ui.form.horas = v; render(); break;
    }
    case "editar-laura": {
      ui.form = syncFormWithDate({ data: el.dataset.data, horas: 0, obs: "" });
      render(); window.scrollTo({top: document.getElementById("l-data").getBoundingClientRect().top + scrollY - 80, behavior:"smooth"}); break;
    }
    case "guardar-laura": {
      const f = ui.form;
      if(!f.data || f.horas <= 0) return;
      const ok = await mutate(s => {
        if(s.pagamentos[monthOf(f.data)]?.pago) return false;
        const ex = s.registos.find(r => r.data === f.data);
        const now = new Date().toISOString();
        if(ex){ if((ex.obs||"") !== f.obs.trim()) ex.obsVista = false; ex.horas = f.horas; ex.obs = f.obs.trim(); ex.atualizadoEm = now; ex.atualizadoPor = "laura"; }
        else s.registos.push({ id: uid(), data: f.data, horas: f.horas, obs: f.obs.trim(), criadoPor: "laura", criadoEm: now });
      }, "Guardado! Obrigado 🙂");
      if(ok){ ui.form = syncFormWithDate({ data: f.data, horas: f.horas, obs: f.obs.trim() }); render(); }
      break;
    }
    case "ler": {
      const id = el.dataset.id;
      await mutate(s => { const n = s.notas.find(x => x.id === id); if(!n) return false; n.lida = true; n.lidaEm = new Date().toISOString(); });
      break;
    }

    case "despesa-toggle": ui.showDespesa = !ui.showDespesa; if(ui.showDespesa) ui.despesa = { descricao:"", valor:"", data: today() }; render(); break;
    case "despesa-add": {
      const d = { descricao: document.getElementById("d-desc").value.trim(), valor: round2(parseFloat(String(document.getElementById("d-valor").value).replace(",","."))), data: document.getElementById("d-data").value };
      if(!d.descricao || !(d.valor > 0) || !d.data){ toast("Indica o que foi, o valor e o dia.", true); return; }
      const ok = await mutate(s => {
        if(s.pagamentos[monthOf(d.data)]?.pago){ toast("Esse mês já foi pago.", true); return false; }
        s.despesas.push({ id: uid(), ...d, criadoPor: ROLE, criadoEm: new Date().toISOString(), vista: ROLE === "admin" });
      }, "Despesa registada.");
      if(ok){ ui.showDespesa = false; render(); }
      break;
    }
    case "despesa-del": {
      const d = STATE.despesas.find(x => x.id === el.dataset.id); if(!d) return;
      if(!confirm(`Apagar a despesa "${d.descricao}" (${fmtEur(d.valor)})?`)) return;
      await mutate(s => { s.despesas = s.despesas.filter(x => x.id !== d.id); }, "Despesa apagada.");
      break;
    }

    case "msg-enviar": {
      const texto = (ui.msg || "").trim();
      if(!texto){ toast("Escreve a mensagem.", true); return; }
      const ok = await mutate(s => { s.mensagens.push({ id: uid(), texto, criadaEm: new Date().toISOString(), vista: false }); }, "Mensagem enviada 🙂");
      if(ok){ ui.msg = ""; render(); }
      break;
    }
    case "msg-apagar": {
      if(!confirm("Apagar esta mensagem?")) return;
      const id = el.dataset.id;
      await mutate(s => { s.mensagens = s.mensagens.filter(m => m.id !== id); }, "Mensagem apagada.");
      break;
    }

    /* --- Admin --- */
    case "visto": {
      const { tipo, id } = el.dataset;
      await mutate(s => {
        if(tipo === "obs"){ const x = s.registos.find(r => r.id === id); if(x) x.obsVista = true; }
        else if(tipo === "msg"){ const x = s.mensagens.find(r => r.id === id); if(x){ x.vista = true; x.vistaPor = ADMIN_NOME; x.vistaEm = new Date().toISOString(); } }
        else { const x = s.despesas.find(r => r.id === id); if(x) x.vista = true; }
      });
      break;
    }
    case "mes": ui.mes = shiftMonth(ui.mes, Number(el.dataset.d)); ui.adminForm = null; render(); break;
    case "ir-mes": ui.mes = el.dataset.mes; ui.adminForm = null; render(); window.scrollTo({top:0, behavior:"smooth"}); break;
    case "reg-editar": {
      const x = STATE.registos.find(r => r.id === el.dataset.id); if(!x) return;
      ui.adminForm = { id: x.id, data: x.data, horas: x.horas, obs: x.obs || "" }; render();
      document.getElementById("a-data").scrollIntoView({behavior:"smooth", block:"center"}); break;
    }
    case "reg-cancelar": ui.adminForm = null; render(); break;
    case "reg-guardar": {
      const data = document.getElementById("a-data").value;
      const horas = round2(parseFloat(document.getElementById("a-horas").value));
      const obs = document.getElementById("a-obs").value.trim();
      const id = ui.adminForm && ui.adminForm.id;
      if(!data || !(horas > 0)){ toast("Indica o dia e as horas.", true); return; }
      const ok = await mutate(s => {
        const now = new Date().toISOString();
        const clash = s.registos.find(r => r.data === data && r.id !== id);
        if(clash){ toast("Já existe um registo nesse dia — edita esse.", true); return false; }
        if(id){ const x = s.registos.find(r => r.id === id); if(!x) return false; Object.assign(x, { data, horas, obs, atualizadoEm: now, atualizadoPor: ADMIN_NOME || "admin" }); }
        else s.registos.push({ id: uid(), data, horas, obs, obsVista: true, criadoPor: "admin", autor: ADMIN_NOME, criadoEm: now });
      }, id ? "Registo atualizado." : "Registo adicionado.");
      if(ok){ ui.adminForm = null; ui.mes = monthOf(data); render(); }
      break;
    }
    case "reg-apagar": {
      const x = STATE.registos.find(r => r.id === el.dataset.id); if(!x) return;
      if(!confirm(`Apagar o registo de ${fmtDate(x.data)} (${fmtH(x.horas)})?`)) return;
      await mutate(s => { s.registos = s.registos.filter(r => r.id !== x.id); }, "Registo apagado.");
      break;
    }
    case "marcar-pago": {
      const r = resumoMes(STATE, ui.mes);
      if(!confirm(`Marcar ${monthLabel(ui.mes)} como pago (${fmtEur(r.valor)} · ${fmtH(r.horas)})?`)) return;
      const key = ui.mes;
      await mutate(s => { const x = resumoMes(s, key); s.pagamentos[key] = { pago: true, data: today(), valor: x.valor, horas: x.horas, despesas: x.totalDespesas, por: ADMIN_NOME }; }, "Mês marcado como pago.");
      break;
    }
    case "desmarcar-pago": {
      if(!confirm(`Anular o pagamento de ${monthLabel(ui.mes)}?`)) return;
      const key = ui.mes;
      await mutate(s => { delete s.pagamentos[key]; }, "Pagamento anulado.");
      break;
    }
    case "copiar-resumo": {
      try{ await navigator.clipboard.writeText(textoResumo(ui.mes)); toast("Resumo copiado."); }
      catch(err){ prompt("Copia o texto:", textoResumo(ui.mes)); }
      break;
    }
    case "imprimir": window.print(); break;
    case "nota-add": {
      const tipo = document.getElementById("n-tipo").value;
      const texto = document.getElementById("n-txt").value.trim();
      if(!texto){ toast("Escreve o texto da nota.", true); return; }
      await mutate(s => { s.notas.push({ id: uid(), tipo, texto, autor: ADMIN_NOME, criadaEm: new Date().toISOString(), lida: false, lidaEm: null }); }, "Nota adicionada.");
      break;
    }
    case "nota-editar": ui.editNotaId = el.dataset.id; render(); break;
    case "nota-cancelar": ui.editNotaId = null; render(); break;
    case "nota-guardar": {
      const id = el.dataset.id; const texto = document.getElementById("edit-nota-txt").value.trim();
      if(!texto) return;
      const ok = await mutate(s => { const n = s.notas.find(x => x.id === id); if(!n) return false; if(n.texto !== texto){ n.texto = texto; n.lida = false; n.lidaEm = null; } }, "Nota atualizada.");
      if(ok){ ui.editNotaId = null; render(); }
      break;
    }
    case "nota-apagar": {
      if(!confirm("Apagar esta nota?")) return;
      const id = el.dataset.id;
      await mutate(s => { s.notas = s.notas.filter(n => n.id !== id); }, "Nota apagada.");
      break;
    }
    case "rate-add": {
      const valor = round2(parseFloat(document.getElementById("r-valor").value));
      const desde = document.getElementById("r-desde").value;
      if(!(valor > 0) || !desde){ toast("Indica o valor e a data.", true); return; }
      const ok = await mutate(s => {
        if(!s.rates.length){ s.rates.push({ desde: "2000-01-01", valor }); return; } // primeiro valor aplica-se a tudo
        s.rates = s.rates.filter(r => r.desde !== desde);
        s.rates.push({ desde, valor });
      }, "Valor-hora guardado.");
      if(ok){ ui.rateForm = null; render(); }
      break;
    }
    case "rate-del": {
      if(!confirm("Apagar este valor-hora do histórico?")) return;
      const d = el.dataset.desde;
      await mutate(s => { if(s.rates.length <= 1) return false; s.rates = s.rates.filter(r => r.desde !== d); }, "Valor apagado.");
      break;
    }
    case "excel": exportExcel(); break;
  }
});

document.addEventListener("input", e => {
  if(!ROLE) return;
  const id = e.target.id;
  if(id === "l-obs" && ui.form) ui.form.obs = e.target.value;
  if(id === "d-desc") ui.despesa.descricao = e.target.value;
  if(id === "m-txt") ui.msg = e.target.value;
  if(id === "d-valor") ui.despesa.valor = e.target.value;
  if(id === "d-data") ui.despesa.data = e.target.value;
  if(id === "r-valor" || id === "r-desde"){
    ui.rateForm = { valor: document.getElementById("r-valor").value, desde: document.getElementById("r-desde").value };
  }
  if(id === "a-data" || id === "a-horas" || id === "a-obs"){
    ui.adminForm = Object.assign(ui.adminForm || { id: null }, {
      data: document.getElementById("a-data").value,
      horas: document.getElementById("a-horas").value,
      obs: document.getElementById("a-obs").value
    });
  }
});
document.addEventListener("change", e => {
  if(e.target.id === "l-data" && ui.form){
    const v = e.target.value; if(!v) return;
    ui.form = syncFormWithDate({ data: v, horas: ui.form.horas, obs: "" });
    render();
  }
});

function exportExcel(){
  if(typeof XLSX === "undefined"){ toast("Biblioteca Excel não carregou. Verifica a ligação.", true); return; }
  const wb = XLSX.utils.book_new();
  const regs = [["Data","Dia","Horas","€/hora","Valor","Observações","Registado por"]];
  [...STATE.registos].sort((a,b)=> a.data.localeCompare(b.data)).forEach(x => {
    const rt = rateFor(STATE, x.data);
    regs.push([fmtDate(x.data), dowOf(x.data), Number(x.horas), rt, rt != null ? round2(rt*x.horas) : null, x.obs || "", x.criadoPor === "admin" ? (x.autor || "Admin") : CONFIG.nomeColaboradora]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(regs), "Registos");
  const desp = [["Data","Descrição","Valor"]];
  [...STATE.despesas].sort((a,b)=> a.data.localeCompare(b.data)).forEach(d => desp.push([fmtDate(d.data), d.descricao, Number(d.valor)]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(desp), "Despesas");
  const meses = [["Mês","Horas","Valor horas","Despesas","Total","Estado","Data do pagamento"]];
  mesesComDados(STATE).reverse().forEach(k => {
    const x = resumoMes(STATE,k);
    meses.push([monthLabel(k), x.horas, x.valorHoras, x.totalDespesas, x.pago ? x.pagamento.valor : x.valor, x.pago ? "Pago" : "Por pagar", x.pago ? fmtDate(x.pagamento.data) : ""]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(meses), "Resumo mensal");
  const rates = [["Desde","€/hora"]];
  sortedRates(STATE).forEach(r => rates.push([r.desde === "2000-01-01" ? "início" : fmtDate(r.desde), r.valor]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rates), "Valor-hora");
  XLSX.writeFile(wb, "Registo_horas_"+CONFIG.nomeColaboradora+"_"+today()+".xlsx");
}

/* =========================================================
   ARRANQUE
   ========================================================= */
let toastTimer;
function toast(msg, err){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"+(err?" err":""); t.textContent = msg;
  t.setAttribute("role","status"); document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(()=> t.remove(), err ? 4500 : 2200);
}
function setBusy(b){ document.getElementById("busy").hidden = !b; }

async function refresh(showToast){
  setBusy(true);
  try{
    STATE = await Store.load();
    if(ui.form) ui.form = syncFormWithDate(ui.form);
    if(showToast) toast("Dados atualizados.");
  }catch(e){
    console.error(e);
    toast("Não foi possível carregar os dados. Verifica a ligação.", true);
  }finally{
    setBusy(false); render();
  }
}
/* Ao voltar à app (ex.: telemóvel desbloqueado), atualiza os dados */
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && ROLE) refresh(); });

(async function boot(){
  ROLE = loadSession();
  if(ROLE) await refresh(); else render();
})();
</script>
